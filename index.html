<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home</title>
<style>
  :root {
    --bg: #ecebf2;
    --card: #f8f8fd;
    --card-glass: rgba(248, 248, 253, 0.72);
    --text: #1d1b22;
    --muted: #6b6878;
    --field: #e2e1ea;
    --accent: #4c5a96;
    --danger: #c43c3c;
    --cols: 4;
    --icon: 58px;
    --label: 13px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141318;
      --card: #201f26;
      --card-glass: rgba(32, 31, 38, 0.72);
      --text: #e7e5ee;
      --muted: #9a97a6;
      --field: #2c2b33;
      --accent: #aab6f0;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 100dvh;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  }

  /* Background image layer */
  #bgLayer {
    position: fixed; inset: 0; z-index: -1;
    background-size: cover; background-position: center;
    display: none;
  }
  body.has-bg #bgLayer { display: block; }
  body.has-bg .tiles, body.has-bg .panel {
    background: var(--card-glass);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  body.has-bg .clock, body.has-bg .clock .time { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.45); }

  /* Pencil button */
  #editBtn {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top)); right: 12px;
    width: 44px; height: 44px; border-radius: 50%;
    border: 0; cursor: pointer;
    background: var(--card-glass); color: var(--text);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display: grid; place-items: center; z-index: 5;
  }
  body.editing #editBtn { background: var(--accent); color: var(--bg); }
  #editBtn svg { width: 20px; height: 20px; }

  .clock { text-align: center; margin-bottom: auto; padding-top: 18vh; color: var(--muted); }
  .clock .time { font-size: 56px; font-weight: 300; color: var(--text); }
  .clock .date { font-size: 15px; margin-top: 4px; }

  /* Settings panel (edit mode) */
  .panel {
    background: var(--card);
    border-radius: 24px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex; flex-direction: column; gap: 12px;
    font-size: 14px;
  }
  .panel .row { display: flex; align-items: center; gap: 8px; }
  .panel .row .grow { flex: 1; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper output { min-width: 24px; text-align: center; font-weight: 600; }
  .stepper button { width: 36px; padding: 8px 0; }

  .tiles {
    background: var(--card);
    border-radius: 28px;
    padding: 18px 6px;
    display: grid;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    gap: 14px 2px;
  }
  .tile {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    text-decoration: none; color: var(--text);
    font-size: var(--label); padding: 4px 0;
    background: none; border: 0; font-family: inherit; cursor: pointer;
    min-width: 0;
  }
  .tile .label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .icon {
    width: var(--icon); height: var(--icon); border-radius: 50%;
    background: var(--bg);
    display: grid; place-items: center; overflow: hidden;
    font-weight: 700; font-size: calc(var(--icon) * 0.38); color: #fff;
  }
  .icon img { width: 52%; height: 52%; border-radius: 6px; }
  .tile:active .icon { transform: scale(0.92); }
  .add .icon { color: var(--muted); font-weight: 300; font-size: calc(var(--icon) * 0.5); border: 2px dashed var(--muted); background: transparent; }

  body.editing .tile:not(.add) .icon { outline: 2px solid var(--accent); outline-offset: 2px; }
  body.editing .tile:not(.add)::after {
    content: "✎"; position: absolute; top: 0;
    right: calc(50% - var(--icon) / 2 - 6px);
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: var(--bg); font-size: 11px;
    display: grid; place-items: center;
  }

  button.btn, dialog button {
    border: 0; border-radius: 999px; padding: 9px 16px;
    font: inherit; font-size: 14px; cursor: pointer;
    background: var(--field); color: var(--text);
  }
  .primary { background: var(--accent) !important; color: var(--bg) !important; }
  .danger { color: var(--danger) !important; }
  .hidden { display: none !important; }

  dialog {
    border: 0; border-radius: 24px; padding: 20px;
    width: min(92vw, 380px);
    background: var(--card); color: var(--text);
    margin: auto auto calc(24px + env(safe-area-inset-bottom));
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  dialog input {
    width: 100%; border: 0; outline: 0; border-radius: 12px;
    padding: 12px 14px; font: inherit; font-size: 16px;
    background: var(--field); color: var(--text);
  }
  dialog .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  dialog .row .spacer { flex: 1; }
</style>
</head>
<body>

<div id="bgLayer"></div>

<button id="editBtn" aria-label="Edit">
  <svg id="icoPencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  <svg id="icoCheck" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
</button>

<div class="clock">
  <div class="time" id="time"></div>
  <div class="date" id="date"></div>
</div>

<section class="panel hidden" id="panel">
  <div class="row">
    <span class="grow">Shortcuts per row</span>
    <div class="stepper">
      <button class="btn" id="colsMinus" aria-label="Fewer">−</button>
      <output id="colsOut">4</output>
      <button class="btn" id="colsPlus" aria-label="More">+</button>
    </div>
  </div>
  <div class="row">
    <span class="grow">Background</span>
    <button class="btn" id="bgPick">Choose image</button>
    <button class="btn danger hidden" id="bgRemove">Remove</button>
  </div>
  <div class="row">
    <span class="grow"></span>
    <button class="btn danger" id="clearBtn">Clear all shortcuts</button>
  </div>
  <input type="file" id="bgFile" accept="image/*" class="hidden">
</section>

<nav class="tiles" id="tiles"></nav>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle">Add shortcut</h2>
    <label for="fName">Name</label>
    <input id="fName" maxlength="20" required>
    <label for="fUrl">URL</label>
    <input id="fUrl" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="example.com" required>
    <div class="row" id="moveRow">
      <button type="button" id="moveL">◀ Move</button>
      <button type="button" id="moveR">Move ▶</button>
      <span class="spacer"></span>
      <button type="button" id="delBtn" class="danger">Delete</button>
    </div>
    <div class="row">
      <span class="spacer"></span>
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
  /* ---------- storage ---------- */
  const KEY = "homepage.shortcuts.v1";
  const SKEY = "homepage.settings.v1";
  const COLORS = ["#4c5a96","#03c75a","#00a495","#ff5544","#24292f","#d93025","#8e44ad","#e67e22"];

  function loadJSON(k, fallback) {
    try { const v = JSON.parse(localStorage.getItem(k)); if (v != null) return v; } catch (e) {}
    return fallback;
  }
  function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  let sites = loadJSON(KEY, []);
  if (!Array.isArray(sites)) sites = [];
  let settings = Object.assign({ cols: 4 }, loadJSON(SKEY, {}));
  const save = () => saveJSON(KEY, sites);
  const saveSettings = () => saveJSON(SKEY, settings);

  // IndexedDB for the background image (too big for localStorage)
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("homepage", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbDo(mode, fn) {
    const db = await idb();
    return new Promise((res, rej) => {
      const req = fn(db.transaction("kv", mode).objectStore("kv"));
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  const idbGet = k => idbDo("readonly", s => s.get(k));
  const idbSet = (k, v) => idbDo("readwrite", s => s.put(v, k));
  const idbDel = k => idbDo("readwrite", s => s.delete(k));

  /* ---------- elements ---------- */
  const $ = id => document.getElementById(id);
  const tilesEl = $("tiles"), dlg = $("dlg"), fName = $("fName"), fUrl = $("fUrl");
  let editing = false, current = -1;

  /* ---------- layout size ---------- */
  const ICON = { 4: 58, 5: 52, 6: 46, 7: 40, 8: 35 };
  const LABEL = { 4: 13, 5: 12, 6: 11, 7: 10, 8: 9.5 };
  function applyCols() {
    const c = Math.min(8, Math.max(4, settings.cols | 0));
    settings.cols = c;
    const r = document.documentElement.style;
    r.setProperty("--cols", c);
    r.setProperty("--icon", ICON[c] + "px");
    r.setProperty("--label", LABEL[c] + "px");
    $("colsOut").textContent = c;
    $("colsMinus").disabled = c <= 4;
    $("colsPlus").disabled = c >= 8;
  }
  $("colsMinus").onclick = () => { settings.cols--; applyCols(); saveSettings(); };
  $("colsPlus").onclick  = () => { settings.cols++; applyCols(); saveSettings(); };

  /* ---------- tiles ---------- */
  function colorFor(name) {
    let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0;
    return COLORS[h % COLORS.length];
  }

  function render() {
    tilesEl.innerHTML = "";
    sites.forEach((s, i) => {
      const el = document.createElement(editing ? "button" : "a");
      el.className = "tile";
      if (editing) el.onclick = () => openDialog(i); else el.href = s.url;

      const icon = document.createElement("span");
      icon.className = "icon";
      const img = new Image();
      img.alt = "";
      img.src = "https://www.google.com/s2/favicons?sz=64&domain_url=" + encodeURIComponent(s.url);
      img.onerror = () => { icon.textContent = [...s.name][0] || "?"; icon.style.background = colorFor(s.name); };
      icon.appendChild(img);

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = s.name;
      el.append(icon, label);
      tilesEl.appendChild(el);
    });

    if (!editing && sites.length === 0) {
      const empty = document.createElement("button");
      empty.className = "tile add";
      empty.style.gridColumn = "1 / -1";
      empty.innerHTML = '<span class="icon">+</span><span class="label">Add your first shortcut</span>';
      empty.onclick = () => { setEditing(true); openDialog(-1); };
      tilesEl.appendChild(empty);
    }
    if (editing) {
      const add = document.createElement("button");
      add.className = "tile add";
      add.innerHTML = '<span class="icon">+</span><span class="label">Add</span>';
      add.onclick = () => openDialog(-1);
      tilesEl.appendChild(add);
    }
  }

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle("editing", on);
    $("panel").classList.toggle("hidden", !on);
    $("icoPencil").classList.toggle("hidden", on);
    $("icoCheck").classList.toggle("hidden", !on);
    $("editBtn").setAttribute("aria-label", on ? "Done" : "Edit");
    render();
  }
  $("editBtn").onclick = () => setEditing(!editing);

  /* ---------- add / edit dialog ---------- */
  function openDialog(i) {
    current = i;
    const isNew = i < 0;
    $("dlgTitle").textContent = isNew ? "Add shortcut" : "Edit shortcut";
    $("moveRow").classList.toggle("hidden", isNew);
    fName.value = isNew ? "" : sites[i].name;
    fUrl.value = isNew ? "" : sites[i].url;
    dlg.showModal();
  }
  const normalizeUrl = u => (u = u.trim(), /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : "https://" + u);

  $("dlgForm").addEventListener("submit", () => {
    const entry = { name: fName.value.trim(), url: normalizeUrl(fUrl.value) };
    if (!entry.name || !fUrl.value.trim()) return;
    if (current < 0) sites.push(entry); else sites[current] = entry;
    save(); render();
  });
  $("cancelBtn").onclick = () => dlg.close();
  $("delBtn").onclick = () => {
    if (current >= 0 && confirm(`Delete "${sites[current].name}"?`)) {
      sites.splice(current, 1); save(); render(); dlg.close();
    }
  };
  function move(d) {
    const j = current + d;
    if (current < 0 || j < 0 || j >= sites.length) return;
    [sites[current], sites[j]] = [sites[j], sites[current]];
    current = j; save(); render();
  }
  $("moveL").onclick = () => move(-1);
  $("moveR").onclick = () => move(1);
  $("clearBtn").onclick = () => {
    if (sites.length && confirm("Remove all shortcuts on this device?")) { sites = []; save(); render(); }
  };

  /* ---------- background image ---------- */
  let bgUrl = null;
  function showBg(blob) {
    if (bgUrl) URL.revokeObjectURL(bgUrl);
    bgUrl = blob ? URL.createObjectURL(blob) : null;
    $("bgLayer").style.backgroundImage = bgUrl ? `url("${bgUrl}")` : "";
    document.body.classList.toggle("has-bg", !!blob);
    $("bgRemove").classList.toggle("hidden", !blob);
  }

  // Shrink large photos so they load instantly and don't fill storage
  function shrink(file, maxSide = 2400) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? res(b) : rej(new Error("encode failed")), "image/jpeg", 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("load failed")); };
      img.src = url;
    });
  }

  $("bgPick").onclick = () => $("bgFile").click();
  $("bgFile").onchange = async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const blob = await shrink(file);
      showBg(blob);
      await idbSet("bg", blob);
    } catch (err) {
      alert("Couldn't use that image. Try a different one.");
    }
  };
  $("bgRemove").onclick = async () => {
    showBg(null);
    try { await idbDel("bg"); } catch (e) {}
  };

  /* ---------- clock ---------- */
  function tick() {
    const d = new Date();
    $("time").textContent = d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
    $("date").textContent = d.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
  }
  tick(); setInterval(tick, 10000);

  /* ---------- start ---------- */
  applyCols();
  render();
  idbGet("bg").then(b => { if (b) showBg(b); }).catch(() => {});

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
